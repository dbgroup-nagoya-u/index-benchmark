workload: zipf

operations:
  - ratios: { scan: 0.95, update_or_write: 0.05 }
    scan_size: 100
    per_thread: false
    skew_parameter: 1.0
    duration: 10

vary_hot_spot: false

initialization:
  use_all_cores: true
  use_bulkload: true

dataset:
  type: integer
  src:
    type: simulation
    path: null
  num: 1e8
  has_locality: true
