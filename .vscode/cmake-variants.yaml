buildType:
  default: debug
  description: Build types
  choices:
    debug:
      short: Debug
      long: Include debugging information without optimizations
      buildType: Debug
      settings:
        INDEX_BENCH_OVERRIDE_MIMALLOC: OFF
    relWithDebInfo:
      short: RelWithDebInfo
      long: Perform optimizations and include debugging informatin
      buildType: RelWithDebInfo
      settings:
        INDEX_BENCH_OVERRIDE_MIMALLOC: OFF
    release:
      short: Release
      long: Perform optimizations and omit debugging informatin
      buildType: Release
      settings:
        INDEX_BENCH_OVERRIDE_MIMALLOC: ON

competitor:
  default: ours
  description: Target competitors
  choices:
    ours:
      short: Ours
      long: Build our (dbgroup) index implementations
      settings:
        INDEX_BENCH_BUILD_B_TREE: ON
        INDEX_BENCH_BUILD_SKIP_LIST: OFF
        INDEX_BENCH_BUILD_B_TREE_OPTIQL: OFF
        INDEX_BENCH_BUILD_MASSTREE: ON
        INDEX_BENCH_BUILD_MASSTREE_BETA: OFF
        INDEX_BENCH_BUILD_YAKUSHIMA: OFF
        INDEX_BENCH_BUILD_ART_OLC: OFF
    sota:
      short: SOTA
      long: Build the state-of-the-art index implementations
      settings:
        INDEX_BENCH_BUILD_B_TREE: ON
        INDEX_BENCH_BUILD_SKIP_LIST: OFF
        INDEX_BENCH_BUILD_B_TREE_OPTIQL: ON
        INDEX_BENCH_BUILD_MASSTREE: ON
        INDEX_BENCH_BUILD_MASSTREE_BETA: ON
        INDEX_BENCH_BUILD_YAKUSHIMA: ON
        INDEX_BENCH_BUILD_ART_OLC: ON

unitTest:
  default: wo_test
  description: Unit tests
  choices:
    wo_test:
      short: w/Test
      long: Build no unit tests
      settings:
        INDEX_BENCH_BUILD_TESTS: ON
        INDEX_BENCH_BUILD_TEST_THREAD_NUM: 8

parameter:
  default: default
  description: Build parameters
  choices:
    default:
      short: ""
      long: Default settings
      settings:
        INDEX_BENCH_PAGE_SIZE: 1024
        INDEX_BENCH_BUILD_LONG_KEYS: OFF
